name: Release

# Run by hand from the Actions tab: Release → Run workflow → enter a version.
# It tests, cross-compiles the Windows and Linux binaries, then creates the tag
# and the GitHub release with the binaries, the install scripts and
# SHA256SUMS attached. The dashboard's install commands download from
# releases/latest/download, so publishing a (non pre-) release is a rollout.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true
        type: string
      prerelease:
        description: "Pre-release (not picked up by releases/latest)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      winver: ${{ steps.v.outputs.winver }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to see existing tags

      - id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION has already been released"
            exit 1
          fi
          {
            echo "version=$VERSION"
            # Windows version resources want four plain numbers.
            echo "winver=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: check
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Build binaries
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Give the Windows executable its version details
        env:
          WINVER: ${{ needs.check.outputs.winver }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          "$(go env GOPATH)/bin/go-winres" simply \
            --arch amd64,arm64 --manifest cli \
            --product-name "InfiniAnalytics Agent" --file-description "InfiniAnalytics server agent" \
            --original-filename infinianalytics-agent.exe --copyright "Copyright (c) InfiniAnalytics" \
            --product-version "$WINVER" --file-version "$WINVER"

      # Everything cross-compiles from here: CGO is off, so no Windows or ARM
      # runner is needed.
      - name: Build
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/infinianalytics-agent-$os-$arch$ext" .
          done
          cp scripts/install.sh scripts/install.ps1 agent.env.example dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          cat > notes.md <<'EOF'
          Install from the dashboard: **Infraestructura → Servidores → Añadir servidor** prints the
          one-line install command with a one-time enrollment code.

          | Platform | Binary |
          |---|---|
          | Linux x64 / ARM64 | `infinianalytics-agent-linux-amd64` / `-arm64` |
          | Windows x64 / ARM64 | `infinianalytics-agent-windows-amd64.exe` / `-arm64.exe` |

          Every file's SHA-256 is in `SHA256SUMS`; the install scripts verify it.
          EOF
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "infinianalytics-agent $VERSION" --generate-notes --notes-file notes.md \
            "${flags[@]}"
